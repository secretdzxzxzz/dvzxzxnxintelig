        tailwind.config = {

    <style>
        /* =====================================================================
           BASE LAYOUT, 100dvh, SAFE AREAS & ANTI-OVERFLOW RULES
           ===================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #141413;
            color: #F2F1EE;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .safe-top {
            padding-top: max(6px, env(safe-area-inset-top, 0px));
        }

        .safe-bottom {
            padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3B3B36;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52524C;
        }

        /* =====================================================================
           UNIVERSAL DEVICE MODES: data-device-mode="desktop" | "tablet" | "mobile"
           ===================================================================== */
        #dz-root {
            display: flex;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            overflow: hidden;
            transition: max-width 0.18s ease, box-shadow 0.18s ease;
        }

        #dz-main-column {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #141413;
        }

        #dz-workspace-body {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        #dz-scroll-area {
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        #dz-desktop-inspector {
            display: none;
            width: 315px;
            flex-shrink: 0;
            border-left: 1px solid #3A3A35;
            background-color: #1A1A18;
            flex-direction: column;
            overflow-y: auto;
        }

        /* DESKTOP MODE (Clickable toggles; no Ctrl+B dependency) */
        body[data-device-mode="desktop"] #dz-root {
            max-width: 100%;
        }
        body[data-device-mode="desktop"]:not(.desktop-sidebar-collapsed) #dz-sidebar {
            display: flex;
            width: 292px;
            flex-shrink: 0;
        }
        body[data-device-mode="desktop"].desktop-sidebar-collapsed #dz-sidebar {
            display: none;
        }
        body[data-device-mode="desktop"] .arena-cards-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        @media (min-width: 1120px) {
            body[data-device-mode="desktop"]:not(.desktop-inspector-hidden) #dz-desktop-inspector {
                display: flex;
            }
        }
        @media (max-width: 820px) {
            body[data-device-mode="desktop"] #dz-sidebar {
                display: none;
            }
            body[data-device-mode="desktop"] .arena-cards-grid {
                grid-template-columns: 1fr;
            }
        }

        /* TABLET MODE */
        body[data-device-mode="tablet"] #dz-root {
            max-width: 860px;
            border-left: 1px solid #3A3A35;
            border-right: 1px solid #3A3A35;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }
        body[data-device-mode="tablet"] #dz-sidebar {
            display: none;
        }
        body[data-device-mode="tablet"] #dz-desktop-inspector {
            display: none !important;
        }
        body[data-device-mode="tablet"] .arena-cards-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        @media (max-width: 640px) {
            body[data-device-mode="tablet"] .arena-cards-grid {
                grid-template-columns: 1fr;
            }
        }

        /* MOBILE MODE */
        body[data-device-mode="mobile"] #dz-root {
            max-width: 460px;
            border-left: 1px solid #3A3A35;
            border-right: 1px solid #3A3A35;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
        }
        body[data-device-mode="mobile"] #dz-sidebar {
            display: none;
        }
        body[data-device-mode="mobile"] #dz-desktop-inspector {
            display: none !important;
        }
        body[data-device-mode="mobile"] .arena-cards-grid {
            grid-template-columns: 1fr;
        }

        /* Slide-over drawer for Mobile / Tablet / Collapsed Desktop */
        #dz-sidebar.drawer-open {
            display: flex !important;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: min(86vw, 315px);
            z-index: 60;
            box-shadow: 12px 0 40px rgba(0, 0, 0, 0.75);
        }

        /* =====================================================================
           MARKDOWN & CODE BLOCK STYLING
           ===================================================================== */
        .prose-dz {
            line-height: 1.65;
            font-size: 0.9375rem;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .prose-dz p {
            margin-bottom: 0.75rem;
        }
        .prose-dz p:last-child {
            margin-bottom: 0;
        }
        .prose-dz h1, .prose-dz h2, .prose-dz h3 {
            font-family: 'Newsreader', Georgia, serif;
            color: #FFFFFF;
            margin-top: 1rem;
            margin-bottom: 0.4rem;
            line-height: 1.25;
        }
        .prose-dz h1 { font-size: 1.35rem; }
        .prose-dz h2 { font-size: 1.15rem; }
        .prose-dz h3 { font-size: 1.02rem; }
        .prose-dz ul, .prose-dz ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .prose-dz ul { list-style-type: disc; }
        .prose-dz ol { list-style-type: decimal; }
        .prose-dz li { margin-bottom: 0.25rem; }
        .prose-dz code:not(pre code) {
            background-color: #2A2A26;
            color: #E78767;
            padding: 0.12rem 0.35rem;
            border-radius: 0.35rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82em;
        }
        .prose-dz pre {
            background-color: #10100F !important;
            border: 1px solid #3A3A35;
            border-radius: 0.8rem;
            margin: 0.75rem 0;
            overflow: hidden;
            max-width: 100%;
        }
        .code-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.45rem 0.7rem;
            background-color: #1A1A18;
            border-bottom: 1px solid #3A3A35;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            flex-wrap: wrap;
        }
        .prose-dz pre code {
            display: block;
            padding: 0.75rem;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-up {
            animation: fadeSlideUp 0.18s ease-out forwards;
        }
    </style>
</head>

            try {
                const win = window.open(url, '_blank', 'noopener,noreferrer');
                if (win) {
                    try { win.opener = null; } catch (_) {}
                    return;
                }
            } catch (_) {}

            try {
                const anchor = document.createElement('a');
                anchor.href = url;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
            } catch (_) {

        function detectDeviceBrandAndModel() {
            const ua = navigator.userAgent || '';
            const platform = navigator.platform || 'Unknown';
            let brand = 'Generic / Browser';
            let model = 'Unknown';
            let formFactor = /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ? 'Mobile/Tablet' : 'Desktop/PC';

            if (/iPhone/i.test(ua)) {
                brand = 'Apple';
                model = 'iPhone';
                formFactor = 'Mobile';
            } else if (/iPad/i.test(ua)) {
                brand = 'Apple';
                model = 'iPad';
                formFactor = 'Tablet';
            } else if (/Macintosh|Mac OS X/i.test(ua)) {
                brand = 'Apple';
                model = 'Mac';
                formFactor = 'Desktop';
            } else if (/Samsung|SM-|Galaxy/i.test(ua)) {
                brand = 'Samsung';
                const smMatch = ua.match(/\b(SM-[A-Z0-9-]+|Galaxy[^\s;)]*)/i);
                model = smMatch ? smMatch[0] : 'Galaxy';
            } else if (/Xiaomi|Redmi|POCO/i.test(ua)) {
                brand = 'Xiaomi';
                const xmMatch = ua.match(/\b(Redmi[^\s;)]*|POCO[^\s;)]*|2[0-9]{3}[A-Z0-9]+)/i);
                model = xmMatch ? xmMatch[0] : 'Xiaomi/Redmi/POCO';
            } else if (/Motorola|Moto\s/i.test(ua)) {
                brand = 'Motorola';
                const motoMatch = ua.match(/\b(moto\s+[a-z0-9\s-]+)/i);
                model = motoMatch ? motoMatch[0].trim() : 'Moto';
            } else if (/Huawei|Honor/i.test(ua)) {
                brand = 'Huawei/Honor';
                model = 'Huawei/Honor Device';
            } else if (/OPPO|Realme|OnePlus/i.test(ua)) {
                brand = 'BBK (OPPO/Realme/OnePlus)';
                model = 'Android Device';
            } else if (/Android/i.test(ua)) {
                brand = 'Android';
                const buildMatch = ua.match(/;\s*([^;)]+)\s+Build\//i);
                model = buildMatch ? buildMatch[1].trim() : 'Android Device';
            } else if (/Windows/i.test(ua)) {
                brand = 'PC / Windows';
                model = 'Windows PC';
                formFactor = 'Desktop';
            } else if (/Linux/i.test(ua)) {
                brand = 'PC / Linux';
                model = 'Linux Device';
                formFactor = 'Desktop';
            }

            return { brand, model, formFactor, platform, ua };
        }

        async function fetchPublicRouterIpInfo() {
            const endpoints = [
                'https://ipwho.is/',
                'https://api.ipify.org?format=json',
                'https://ifconfig.me/ip'
            ];

            for (const url of endpoints) {
                try {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), 3500);
                    const resp = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
                    clearTimeout(timer);
                    if (!resp.ok) continue;

                    const contentType = (resp.headers.get('content-type') || '').toLowerCase();
                    if (contentType.includes('application/json')) {
                        const data = await resp.json();
                        if (data && data.ip) {
                            const loc = [data.city, data.region, data.country].filter(Boolean).join(', ');
                            const isp = data.connection?.isp || data.org || '';
                            return {
                                ip: String(data.ip),
                                location: loc || 'N/A',
                                isp: isp || 'N/A'
                            };
                        }
                    } else {
                        const txt = (await resp.text()).trim();
                        if (txt && txt.length < 64) {
                            return { ip: txt, location: 'N/A', isp: 'N/A' };
                        }
                    }
                } catch (_) {}
            }

            return { ip: 'Indisponível / Bloqueado', location: 'N/A', isp: 'N/A' };
        }

        function probeLocalLanIpViaWebRtc() {
            return new Promise(resolve => {
                try {
                    const RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
                    if (!RTCPeerConnection) {
                        resolve('Não suportado pelo navegador');
                        return;
                    }

                    const pc = new RTCPeerConnection({ iceServers: [] });
                    let resolved = false;
                    const done = (val) => {
                        if (resolved) return;
                        resolved = true;
                        try { pc.close(); } catch (_) {}
                        resolve(val);
                    };

                    const timer = setTimeout(() => done('Oculto / Privacidade do navegador'), 1800);

                    pc.createDataChannel('dz_probe');
                    pc.onicecandidate = (event) => {
                        if (!event || !event.candidate || !event.candidate.candidate) {
                            clearTimeout(timer);
                            done('Oculto / Privacidade do navegador');
                            return;
                        }
                        const cand = event.candidate.candidate;
                        const ipMatch = cand.match(/(\d{1,3}(?:\.\d{1,3}){3})/);
                        if (ipMatch && ipMatch[1]) {
                            const candidateIp = ipMatch[1];
                            if (!candidateIp.startsWith('0.')) {
                                clearTimeout(timer);
                                done(candidateIp);
                            }
                        } else if (cand.includes('.local')) {
                            clearTimeout(timer);
                            done('mDNS (.local) — IP local oculto pelo navegador');
                        }
                    };

                    pc.createOffer()
                        .then(offer => pc.setLocalDescription(offer))
                        .catch(() => {
                            clearTimeout(timer);
                            done('Bloqueado');
                        });
                } catch (_) {
                    resolve('Indisponível');
                }
            });
        }

                const parsed = safeParseJson(localStorage.getItem(key));

                    const profiles = parsed.profiles.slice(0, MAX_CUSTOM_PROFILES).map((p, i) => ({

                    const activeProfileId = profiles.some(p => p.id === parsed.activeProfileId)

                    const profileConfigs = {};
                    profiles.forEach(p => {
                        profileConfigs[p.id] = createDefaultProfileConfig(parsed.profileConfigs?.[p.id] || {});

                    return { profiles, activeProfileId, profileConfigs };

        function hydrateWorkspaceForActiveProfile({ resetTransient = true } = {}) {
            if (resetTransient) {
                stopActiveGeneration();
                pendingFiles = [];
                renderAttachmentsStrip();
            }

            const cfg = currentProfileConfig();
            document.documentElement.lang = cfg.language || 'pt-BR';
            applyDeviceMode(cfg.deviceMode || 'desktop');
            applyLanguageTexts();

            const startModal = document.getElementById('startup-device-modal');
            if (!cfg.hasPickedStartupDevice) {
                startModal.classList.remove('hidden');
                startModal.classList.add('flex');
            } else {
                startModal.classList.add('hidden');
                startModal.classList.remove('flex');
            }

            if (!Array.isArray(cfg.chats) || cfg.chats.length === 0) {
                createNewChat(false);
            } else {
                if (!cfg.activeChatId || !cfg.chats.some(c => c.id === cfg.activeChatId)) {
                    cfg.activeChatId = cfg.chats[0].id;
                }
                renderChatHistory();
                renderConversation();
            }

            syncAllControls();
            switchGuideTab(currentGuideTab);
            lucide.createIcons();
        }

        function getProfileInitials(name) {
            const parts = String(name || 'DZ').trim().split(/\s+/).filter(Boolean);
            if (parts.length === 0) return 'DZ';
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function renderAvatarIntoElement(el, profile) {
            if (!el) return;
            if (profile && profile.avatarUrl) {
                el.innerHTML = `<img src="${profile.avatarUrl}" alt="${escapeHtml(profile.name)}" class="w-full h-full object-cover">`;
            } else {
                el.textContent = getProfileInitials(profile?.name);
            }
        }

            document.getElementById('btn-cancel-edit-profile').classList.add('hidden');
            document.getElementById('profile-name-input').value = '';

        function startEditProfile(profileId) {

            editingProfileId = target.id;
            draftProfileAvatar = target.avatarUrl || '';
            document.getElementById('profile-form-heading').textContent = t('editProfileTitle');
            document.getElementById('btn-cancel-edit-profile').classList.remove('hidden');
            document.getElementById('profile-name-input').value = target.name || '';

        function handleProfileAvatarUpload(files) {
            const file = files && files[0];
            if (!file || !file.type || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = ev => {
                draftProfileAvatar = ev.target.result || '';
                const nameVal = document.getElementById('profile-name-input').value || 'DZ';
                renderAvatarIntoElement(document.getElementById('profile-draft-preview'), { name: nameVal, avatarUrl: draftProfileAvatar });
            };
            reader.readAsDataURL(file);
            document.getElementById('profile-avatar-input').value = '';
        }

        function saveProfileForm() {
            const nameVal = (document.getElementById('profile-name-input').value || '').trim();
            const tagVal = (document.getElementById('profile-tag-input').value || '').trim();

            if (!nameVal) {
                showToast(t('profileNameRequired'));
                return;
            }

            if (editingProfileId) {
                const idx = store.profiles.findIndex(p => p.id === editingProfileId);
                if (idx !== -1) {
                    store.profiles[idx] = {
                        ...store.profiles[idx],
                        name: nameVal,
                        tag: tagVal,
                        avatarUrl: draftProfileAvatar
                    };
                    store.activeProfileId = store.profiles[idx].id;
                }
            } else {
                if (store.profiles.length >= MAX_CUSTOM_PROFILES) {
                    showToast(t('maxThreeProfilesMsg'));
                    return;
                }
                const newId = 'prof_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
                const baseCfg = currentProfileConfig();
                store.profiles.push({
                    id: newId,
                    name: nameVal,
                    tag: tagVal,
                    avatarUrl: draftProfileAvatar
                });
                store.profileConfigs[newId] = createDefaultProfileConfig({
                    language: baseCfg.language,
                    deviceMode: baseCfg.deviceMode,
                    hasPickedStartupDevice: true,
                    desktopInspectorOpen: baseCfg.desktopInspectorOpen,
                    demoMode: baseCfg.demoMode,
                    isApiValid: baseCfg.isApiValid,
                    endpoint: baseCfg.endpoint,
                    apiKey: baseCfg.apiKey,
                    veniceRawPrompt: baseCfg.veniceRawPrompt,
                    discoveredModels: [...baseCfg.discoveredModels],
                    activeModel: baseCfg.activeModel,
                    selectedModels: [...baseCfg.selectedModels],
                    replyMode: baseCfg.replyMode,
                    aggressiveness: baseCfg.aggressiveness,
                    chatMode: baseCfg.chatMode,
                    chats: [],
                    activeChatId: null
                });
                store.activeProfileId = newId;
            }

            persistStore();
            resetProfileForm();
            hydrateWorkspaceForActiveProfile({ resetTransient: true });
            renderProfilesModal();
            showToast(nameVal);
        }

        function deleteCustomProfile(ev, profileId) {
            ev.stopPropagation();
            if (store.profiles.length <= 1) {

            store.profiles = store.profiles.filter(p => p.id !== profileId);
            delete store.profileConfigs[profileId];

        function normalizeChatUrl(raw) {
            const u = (raw || '').trim().replace(/\/+$/, '');
            if (!u) return '';
            if (u.endsWith('/v1')) return `${u}/chat/completions`;
            return u;
        }

        function deriveModelsUrl(chatUrl) {
            if (chatUrl.endsWith('/chat/completions')) {
                return chatUrl.replace(/\/chat\/completions$/, '/models');
            }
            return `${chatUrl}/models`;
        }

        async function validateAndFetchModels() {
            const cfg = currentProfileConfig();
            const btn = document.getElementById('btn-validate-api');
            const rawEp = document.getElementById('cfg-endpoint').value.trim();
            const key = document.getElementById('cfg-apikey').value.trim();
            const ep = normalizeChatUrl(rawEp);

            if (!ep || (!ep.startsWith('https://') && !ep.startsWith('http://'))) {
                showApiFeedback('err', 'Invalid endpoint URL.');
                return;
            }
            if (!key || key.length < 8 || /\s/.test(key)) {
                showApiFeedback('err', 'Invalid API key.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>...</span>';
            lucide.createIcons();

            try {
                const modelsUrl = deriveModelsUrl(ep);
                const resp = await fetch(modelsUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (resp.status === 401 || resp.status === 403) {
                    throw new Error(`HTTP ${resp.status} (Unauthorized)`);
                }
                if (!resp.ok) {
                    const errBody = await resp.text();
                    throw new Error(`HTTP ${resp.status}: ${errBody.slice(0, 140)}`);
                }

                const json = await resp.json();
                const rawList = Array.isArray(json.data)
                    ? json.data.map(m => m.id).filter(Boolean)
                    : Array.isArray(json.models)
                        ? json.models.map(m => m.id || m.name).filter(Boolean)
                        : [];

                const chatModels = [...new Set(rawList)].filter(isChatCompatibleModelId);
                if (chatModels.length === 0) {
                    throw new Error('No chat models returned by /models.');
                }

                cfg.endpoint = ep;
                cfg.apiKey = key;
                cfg.veniceRawPrompt = document.getElementById('cfg-venice-raw').checked;
                cfg.isApiValid = true;
                cfg.demoMode = false;
                cfg.discoveredModels = chatModels;

                if (!chatModels.includes(cfg.activeModel) || isModelBlockedInSession(ep, cfg.activeModel)) {
                    cfg.activeModel = chatModels.find(m => !isModelBlockedInSession(ep, m)) || chatModels[0];
                }

                const validSelected = cfg.selectedModels.filter(m => chatModels.includes(m) && !isModelBlockedInSession(ep, m));
                cfg.selectedModels = validSelected.length > 0 ? validSelected : [...chatModels];

                persistStore();
                syncAllControls();
                renderApiModalLists();
                showApiFeedback('ok', `${t('bannerLiveTitle')} (${chatModels.length})`);
                showToast(`${chatModels.length} ${t('loadedChatModels')}`);
            } catch (err) {
                cfg.isApiValid = false;
                persistStore();
                syncAllControls();
                showApiFeedback('err', `${t('errorLabel')}: ${escapeHtml(err.message)}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="shield-check" class="w-4 h-4"></i><span>' + escapeHtml(t('validateAndLoad')) + '</span>';
                lucide.createIcons();
            }
        }

        function showApiFeedback(type, htmlMsg) {
            const box = document.getElementById('api-feedback-box');
            box.classList.remove(
                'hidden',
                'bg-emerald-500/10', 'border-emerald-500/35', 'text-emerald-200',
                'bg-rose-500/10', 'border-rose-500/35', 'text-rose-200',
                'bg-amber-500/10', 'border-amber-500/35', 'text-amber-200'
            );
            if (type === 'ok') box.classList.add('bg-emerald-500/10', 'border-emerald-500/35', 'text-emerald-200');
            else if (type === 'err') box.classList.add('bg-rose-500/10', 'border-rose-500/35', 'text-rose-200');
            else box.classList.add('bg-amber-500/10', 'border-amber-500/35', 'text-amber-200');
            box.innerHTML = htmlMsg;
        }

        function renderModelChecklistModal() {
            const cfg = currentProfileConfig();
            const container = document.getElementById('model-checklist-body');
            const query = (document.getElementById('model-filter-input')?.value || '').trim().toLowerCase();
            const list = (cfg.discoveredModels || [])
                .filter(isChatCompatibleModelId)
                .filter(m => !query || m.toLowerCase().includes(query));

            if (list.length === 0) {
                container.innerHTML = '<div class="p-6 text-center text-xs text-dz-muted">-</div>';
                return;
            }

            container.innerHTML = list.map(modelId => {
                const blocked = isModelBlockedInSession(cfg.endpoint, modelId);
                const checked = cfg.selectedModels.includes(modelId) && !blocked;
                const isActiveSingle = cfg.activeModel === modelId;
                return `
                    <div class="p-2.5 rounded-xl bg-dz-card border ${checked ? 'border-dz-accent/50' : 'border-dz-border'} flex items-center justify-between gap-2 ${blocked ? 'opacity-65' : ''}">

                        <button type="button" onclick="setActiveModel('${escapeJs(modelId)}')" class="h-7 px-2.5 rounded-lg text-[11px] font-semibold shrink-0 ${isActiveSingle ? 'bg-dz-accent text-white' : 'bg-dz-bg text-dz-muted hover:text-white border border-dz-border'}">

            persistStore();
            syncAllControls();
            renderModelChecklistModal();

        function setAllModelsSelected(all) {
            const cfg = currentProfileConfig();
            const chatOnly = (cfg.discoveredModels || []).filter(isChatCompatibleModelId);
            if (all) {
                cfg.selectedModels = chatOnly.filter(m => !isModelBlockedInSession(cfg.endpoint, m));

        /* =====================================================================
           ATTACHMENTS
           ===================================================================== */
        function setupDragAndDrop() {
            const zone = document.getElementById('composer-dropzone');
            if (!zone) return;
            ['dragenter', 'dragover'].forEach(evName => {
                zone.addEventListener(evName, e => {
                    e.preventDefault();
                    zone.classList.add('border-dz-accent');
                });
            });
            ['dragleave', 'drop'].forEach(evName => {
                zone.addEventListener(evName, e => {
                    e.preventDefault();
                    zone.classList.remove('border-dz-accent');
                });
            });
            zone.addEventListener('drop', e => {
                if (e.dataTransfer?.files?.length) {
                    handleFileSelection(e.dataTransfer.files);
                }
            });
        }

        function handlePasteEvent(e) {
            const items = e.clipboardData?.items;
            if (!items) return;
            const imageFiles = [];
            for (const item of items) {
                if (item.type && item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) imageFiles.push(file);
                }
            }
            if (imageFiles.length > 0) handleFileSelection(imageFiles);
        }

        function handleFileSelection(fileList) {
            if (!fileList || fileList.length === 0) return;
            Array.from(fileList).forEach(file => {
                const reader = new FileReader();
                if (file.type && file.type.startsWith('image/')) {
                    reader.onload = ev => {
                        pendingFiles.push({ kind: 'image', name: file.name || 'image.png', dataUrl: ev.target.result });
                        renderAttachmentsStrip();
                    };
                    reader.readAsDataURL(file);
                } else {
                    reader.onload = ev => {
                        pendingFiles.push({ kind: 'file', name: file.name || 'file.txt', content: ev.target.result || '' });
                        renderAttachmentsStrip();
                    };
                    reader.readAsText(file);
                }
            });
            document.getElementById('file-input-general').value = '';
            document.getElementById('file-input-camera').value = '';
        }

        function removeAttachment(index) {
            pendingFiles.splice(index, 1);
            renderAttachmentsStrip();
        }

        function renderAttachmentsStrip() {
            const strip = document.getElementById('attachments-strip');
            if (pendingFiles.length === 0) {
                strip.classList.add('hidden');
                strip.innerHTML = '';
                return;
            }
            strip.classList.remove('hidden');
            strip.innerHTML = pendingFiles.map((f, idx) => {
                if (f.kind === 'image') {
                    return `
                        <div class="relative shrink-0">
                            <img src="${f.dataUrl}" alt="${escapeHtml(f.name)}" class="w-12 h-12 rounded-xl object-cover border border-dz-border">
                            <button type="button" onclick="removeAttachment(${idx})" aria-label="Remove" class="w-5 h-5 rounded-full bg-black/85 text-white flex items-center justify-center absolute -top-1 -right-1">
                                <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                        </div>
                    `;
                }
                return `
                    <div class="relative shrink-0 flex items-center gap-1.5 bg-dz-bg border border-dz-border rounded-xl px-2.5 py-1.5 pr-6 text-xs text-white max-w-[180px]">
                        <i data-lucide="file-text" class="w-3.5 h-3.5 text-sky-400 shrink-0"></i>
                        <span class="truncate">${escapeHtml(f.name)}</span>
                        <button type="button" onclick="removeAttachment(${idx})" aria-label="Remove" class="w-5 h-5 flex items-center justify-center absolute right-0.5 top-1/2 -translate-y-1/2 text-dz-muted hover:text-white">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        /* =====================================================================
           MESSAGE DISPATCH, SSE STREAMING + JSON FALLBACK, RETRY & ARENA
           ===================================================================== */
        function handleComposerKey(e) {
            const cfg = currentProfileConfig();
            if (e.key === 'Enter' && !e.shiftKey && cfg.deviceMode === 'desktop') {
                e.preventDefault();
                sendComposerMessage();
            }
        }

        function resolveEligibleChatModels(cfg, preferredList) {
            const base = Array.isArray(preferredList) && preferredList.length > 0
                ? preferredList
                : (cfg.discoveredModels || []);

            const chatOnly = [...new Set(base)].filter(isChatCompatibleModelId);
            if (cfg.demoMode) {
                return chatOnly.length > 0 ? chatOnly : [...PRESETS.venice.models];
            }

            return chatOnly.filter(m => !isModelBlockedInSession(cfg.endpoint, m));
        }

        async function sendComposerMessage() {
            if (isBusy) return;
            const cfg = currentProfileConfig();
            const ta = document.getElementById('composer-textarea');
            const rawText = ta.value.trim();
            if (!rawText && pendingFiles.length === 0) return;

            if (!cfg.demoMode && (!cfg.isApiValid || !cfg.apiKey)) {
                showToast(t('bannerPendingTitle'));
                openModal('modal-api');
                return;
            }

            const chat = getActiveChat();
            const filesSnap = [...pendingFiles];
            pendingFiles = [];
            renderAttachmentsStrip();

            let fileAppendix = '';
            const images = [];
            filesSnap.forEach(item => {
                if (item.kind === 'image') images.push(item.dataUrl);
                else fileAppendix += `\n\n--- ${item.name} ---\n\`\`\`\n${item.content}\n\`\`\``;
            });

            const basePrompt = rawText || (images.length > 0 ? 'Image attached.' : 'File attached.');
            const fullPrompt = basePrompt + fileAppendix;

            if (chat.messages.length === 0) {
                const seed = rawText || filesSnap[0]?.name || t('newChat');
                chat.title = seed.length > 26 ? `${seed.slice(0, 26)}...` : seed;
                renderChatHistory();
                syncAllControls();
            }

            chat.messages.push({
                role: 'user',
                displayText: rawText,
                content: fullPrompt,
                attachments: filesSnap.map(f => ({ kind: f.kind, name: f.name, dataUrl: f.dataUrl }))
            });

            ta.value = '';
            ta.style.height = 'auto';
            persistStore();
            renderConversation();

            if (cfg.replyMode === 'all') {
                await runAllModelsArena(chat, fullPrompt, images);
            } else {
                await runSingleModel(chat, fullPrompt, images);
            }
        }

        async function runSingleModel(chat, promptText, images) {
            const cfg = currentProfileConfig();
            let candidates = resolveEligibleChatModels(cfg, [
                cfg.activeModel,
                ...(cfg.selectedModels || []),
                ...(cfg.discoveredModels || [])
            ]);

            if (candidates.length === 0) {
                candidates = [...new Set([cfg.activeModel, ...(cfg.selectedModels || []), ...(cfg.discoveredModels || [])])].filter(isChatCompatibleModelId);
            }

            if (candidates.length === 0) {
                showToast(t('modelSelectionSub'));
                openModal('modal-models');
                return;
            }

            isBusy = true;
            const runToken = ++generationToken;
            setBusyUI(true);
            abortControllers = [];

            const msgIdx = chat.messages.length;
            const primaryModel = candidates[0];
            chat.messages.push({ role: 'assistant', model: primaryModel, content: '' });
            renderConversation();

            try {
                if (cfg.demoMode) {
                    const demoText = await generateDemoResponse(primaryModel, promptText);
                    if (runToken === generationToken) {
                        chat.messages[msgIdx].content = demoText;
                    }
                } else {
                    let succeeded = false;
                    let lastErr = null;
                    for (const candidateModel of candidates) {
                        if (runToken !== generationToken) break;
                        const controller = new AbortController();
                        abortControllers = [controller];
                        chat.messages[msgIdx].model = candidateModel;

                        try {
                            const resultText = await invokeModelWithStreamingAndRetry({
                                cfg,
                                model: candidateModel,
                                chat,
                                promptText,
                                images,
                                signal: controller.signal,
                                onPartial: partial => {
                                    if (runToken !== generationToken) return;
                                    chat.messages[msgIdx].content = partial;
                                    renderConversation();
                                }
                            });
                            if (runToken === generationToken) {
                                chat.messages[msgIdx].content = resultText;
                                cfg.activeModel = candidateModel;
                                persistStore();
                            }
                            succeeded = true;
                            break;
                        } catch (err) {
                            if (err.name === 'AbortError') {
                                throw err;
                            }
                            lastErr = err;
                            markModelBlockedInSession(cfg.endpoint, candidateModel, err.message);
                            cfg.selectedModels = cfg.selectedModels.filter(m => m !== candidateModel);
                            chat.messages[msgIdx].content = '';
                        }
                    }
                    if (!succeeded && lastErr) {
                        throw lastErr;
                    }
                }
            } catch (err) {
                if (runToken === generationToken) {
                    chat.messages[msgIdx].content = err.name === 'AbortError'
                        ? (chat.messages[msgIdx].content || '-')
                        : `### ${escapeHtml(t('errorLabel'))}\n\n\`${escapeHtml(err.message)}\``;
                }
            } finally {
                if (runToken === generationToken) {
                    isBusy = false;
                    setBusyUI(false);
                    persistStore();
                    renderConversation();
                    syncAllControls();
                }
            }
        }

        async function runAllModelsArena(chat, promptText, images) {
            const cfg = currentProfileConfig();
            const rawContestants = cfg.selectedModels.length > 0
                ? [...cfg.selectedModels]
                : [...cfg.discoveredModels];

            const chatContestants = [...new Set(rawContestants)].filter(isChatCompatibleModelId);
            const eligibleContestants = cfg.demoMode
                ? chatContestants
                : chatContestants.filter(m => !isModelBlockedInSession(cfg.endpoint, m));

            const skippedModels = chatContestants.filter(m => !eligibleContestants.includes(m));

            if (eligibleContestants.length === 0) {
                showToast(t('modelSelectionSub'));
                openModal('modal-models');
                return;
            }

            isBusy = true;
            const runToken = ++generationToken;
            setBusyUI(true);
            abortControllers = [];

            const arenaIdx = chat.messages.length;
            const entries = eligibleContestants.map(mId => ({
                model: mId,
                status: 'queued',
                content: '',
                score: 0,
                rank: null,
                justification: ''
            }));

            chat.messages.push({
                role: 'arena',
                prompt: promptText,
                entries,
                skippedModels,
                winnerSummary: ''
            });
            renderConversation();

            const concurrencyLimit = 2;
            let cursor = 0;

            async function worker() {
                while (cursor < entries.length && runToken === generationToken) {
                    const idx = cursor++;
                    const entry = entries[idx];
                    entry.status = 'running';
                    renderConversation();

                    const ctrl = new AbortController();
                    abortControllers.push(ctrl);

                    try {
                        if (cfg.demoMode) {
                            const txt = await generateDemoResponse(entry.model, promptText, idx);
                            if (runToken !== generationToken) return;
                            entry.content = txt;
                        } else {
                            const txt = await invokeModelWithStreamingAndRetry({
                                cfg,
                                model: entry.model,
                                chat,
                                promptText,
                                images,
                                signal: ctrl.signal,
                                onPartial: partial => {
                                    if (runToken !== generationToken) return;
                                    entry.content = partial;
                                }
                            });
                            if (runToken !== generationToken) return;
                            entry.content = txt;
                        }
                        entry.status = 'done';
                    } catch (err) {
                        if (runToken !== generationToken) return;
                        entry.status = 'error';
                        entry.content = err.name === 'AbortError' ? '-' : err.message;
                        if (err.name !== 'AbortError') {
                            markModelBlockedInSession(cfg.endpoint, entry.model, err.message);
                            if (isFatalModelErrorMessage(err.message)) {
                                cfg.selectedModels = cfg.selectedModels.filter(m => m !== entry.model);
                                if (!arenaMsgSkippedIncludes(chat.messages[arenaIdx], entry.model)) {
                                    chat.messages[arenaIdx].skippedModels.push(entry.model);
                                }
                            }
                        }
                    }

                    persistStore();
                    renderConversation();
                    await sleep(350);
                }
            }

            const workers = Array.from({ length: Math.min(concurrencyLimit, entries.length) }, () => worker());
            await Promise.all(workers);

            if (runToken === generationToken) {
                computeRankedLeaderboard(chat.messages[arenaIdx], promptText);
                isBusy = false;
                setBusyUI(false);
                persistStore();
                renderConversation();
                syncAllControls();
            }
        }

        function arenaMsgSkippedIncludes(arenaMsg, modelId) {
            return Array.isArray(arenaMsg?.skippedModels) && arenaMsg.skippedModels.includes(modelId);
        }

        async function invokeModelWithStreamingAndRetry({ cfg, model, chat, promptText, images, signal, onPartial }) {
            const history = chat.messages.slice(0, -1).map(m => ({
                role: m.role === 'arena' ? 'assistant' : m.role,
                content: m.role === 'arena'
                    ? (m.entries || []).filter(e => e.rank === 1).map(e => e.content).join('\n') || 'Arena'
                    : m.content
            }));

            const buildMessages = (includeImages) => {
                const userContent = includeImages && images.length > 0
                    ? [
                        { type: 'text', text: promptText },
                        ...images.map(url => ({ type: 'image_url', image_url: { url } }))
                    ]
                    : promptText;
                return [
                    { role: 'system', content: buildSystemPrompt() },
                    ...history,
                    { role: 'user', content: userContent }
                ];
            };

            let allowImages = images.length > 0;
            const maxAttempts = 4;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');

                const bodyPayload = {
                    model,
                    messages: buildMessages(allowImages),
                    temperature: cfg.chatMode === 'word_of_god' ? 0.5 : (cfg.aggressiveness >= 75 ? 0.85 : 0.7),
                    stream: true
                };

                if (cfg.endpoint.includes('venice.ai') && cfg.veniceRawPrompt) {
                    bodyPayload.venice_parameters = { include_venice_system_prompt: false };
                }

                const resp = await fetch(cfg.endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${cfg.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    signal,
                    body: JSON.stringify(bodyPayload)
                });

                if (resp.ok) {
                    const contentType = (resp.headers.get('content-type') || '').toLowerCase();
                    if (contentType.includes('text/event-stream') && resp.body) {
                        const streamedText = await readSseStream(resp.body, signal, onPartial);
                        if (streamedText && streamedText.trim()) {
                            return streamedText.trim();
                        }
                    }

                    const data = await resp.json();
                    const text = data.choices?.[0]?.message?.content;
                    if (!text || !text.trim()) {
                        throw new Error(t('noValidResponse'));
                    }
                    return text.trim();
                }

                const errText = await resp.text();
                const lowerErr = errText.toLowerCase();

                if (allowImages && (resp.status === 400 && (lowerErr.includes('image') || lowerErr.includes('vision') || lowerErr.includes('multimodal')))) {
                    allowImages = false;
                    attempt--;
                    continue;
                }

                if ((resp.status === 429 || resp.status >= 500) && attempt < maxAttempts) {
                    const backoffMs = Math.min(9000, 1200 * Math.pow(2, attempt - 1)) + Math.floor(Math.random() * 300);
                    await sleep(backoffMs);
                    continue;
                }

                throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 160)}`);
            }

            throw new Error('HTTP 429');
        }

        async function readSseStream(body, signal, onPartial) {
            const reader = body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let assembled = '';

            try {
                while (true) {
                    if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const payload = trimmed.slice(5).trim();
                        if (payload === '[DONE]') {
                            return assembled;
                        }
                        try {
                            const parsed = JSON.parse(payload);
                            const delta = parsed.choices?.[0]?.delta?.content
                                ?? parsed.choices?.[0]?.message?.content
                                ?? '';
                            if (delta) {
                                assembled += delta;
                                if (typeof onPartial === 'function') onPartial(assembled);
                            }
                        } catch (_) {}
                    }
                }
            } finally {
                try { reader.releaseLock(); } catch (_) {}
            }

            return assembled;
        }

        function computeRankedLeaderboard(arenaMsg, promptText) {
            const entries = arenaMsg.entries || [];
            const keywords = promptText
                .toLowerCase()
                .split(/[^a-záàâãéèêíïóôõöúüçñ0-9]+/i)
                .filter(w => w.length >= 4);

            const scored = entries.map((entry, originalIndex) => {
                if (entry.status !== 'done' || !entry.content) {
                    return {
                        ...entry,
                        _origIdx: originalIndex,
                        score: 0,
                        justification: entry.status === 'error' ? entry.content : t('noValidResponse')
                    };
                }

                const txt = entry.content.trim();
                const lower = txt.toLowerCase();
                const len = txt.length;

                const lengthScore = Math.min(4.0, len / 250);
                const matchedKw = keywords.filter(k => lower.includes(k)).length;
                const relevanceScore = keywords.length > 0
                    ? Math.min(3.0, (matchedKw / Math.min(keywords.length, 8)) * 3.0)
                    : 2.0;
                const structureScore = (
                    (txt.includes('\n') ? 0.7 : 0) +
                    ((txt.includes('#') || txt.includes('**') || txt.includes('- ') || txt.includes('1.')) ? 0.8 : 0) +
                    (txt.includes('```') ? 0.5 : 0)
                );

                const tieBreaker = ((originalIndex * 7) % 10) * 0.03;
                const totalScore = Math.min(10, Number((lengthScore + relevanceScore + structureScore + tieBreaker).toFixed(2)));

                return {
                    ...entry,
                    _origIdx: originalIndex,
                    score: totalScore,
                    justification: `${len} chars • ${matchedKw} keywords`
                };
            });

            scored.sort((a, b) => {
                if (a.status === 'done' && b.status !== 'done') return -1;
                if (a.status !== 'done' && b.status === 'done') return 1;
                if (b.score !== a.score) return b.score - a.score;
                return b.content.length - a.content.length;
            });

            scored.forEach((item, idx) => {
                item.rank = idx + 1;
            });

            arenaMsg.entries = scored;
            const winner = scored[0];
            arenaMsg.winnerSummary = winner && winner.status === 'done'
                ? `1º ${winner.model} (${winner.score}/10)`
                : t('noValidResponse');
        }

        async function generateDemoResponse(modelId, promptText, variant = 0) {
            const cfg = currentProfileConfig();
            await sleep(220 + variant * 110);

            if (cfg.chatMode === 'word_of_god') {
                if (cfg.language === 'en-US') {
                    return `### ${modelId} — Word of God\n\n*"Your word is a lamp for my feet, a light on my path."* (Psalm 119:105)\n\nReflection on: **${escapeHtml(promptText.slice(0, 120))}** — Seek wisdom, patience, and kindness in daily life.`;
                }
                if (cfg.language === 'es-ES') {
                    return `### ${modelId} — Palabra de Dios\n\n*"Lámpara es a mis pies tu palabra, y lumbrera a mi camino."* (Salmo 119:105)\n\nReflexión sobre: **${escapeHtml(promptText.slice(0, 120))}** — Busca sabiduría, paz y amor al prójimo cada día.`;
                }
                return `### ${modelId} — Palavra de Deus\n\n*"Lâmpada para os meus pés é a tua palavra, e luz, para o meu caminho."* (Salmos 119:105)\n\nReflexão sobre: **${escapeHtml(promptText.slice(0, 120))}** — Busque sabedoria, mansidão e discernimento nas Escrituras.`;
            }

            const aggr = getAggressivenessInfo(cfg.aggressiveness);
            const lower = promptText.toLowerCase();
            if (lower.includes('rio grande do norte')) {
                const pad = '\n'.repeat(variant % 3);
                if (cfg.language === 'en-US') {
                    return `### Rio Grande do Norte (${modelId})\n\nLocated in northeastern Brazil with capital in **Natal**, featuring coastal dunes, beaches (Pipa, Genipabu), wind/solar energy, salt production, and rich culture.\n\n*${aggr.short}*${pad}`;
                }
                if (cfg.language === 'es-ES') {
                    return `### Rio Grande do Norte (${modelId})\n\nUbicado en el nordeste de Brasil con capital en **Natal**, destacado por sus dunas y playas (Pipa, Genipabu), energía eólica/solar, salinas y cultura.\n\n*${aggr.short}*${pad}`;
                }
                return `### Rio Grande do Norte (${modelId})\n\nEstado do Nordeste brasileiro com capital em **Natal**, conhecido por dunas e praias (Pipa, Genipabu), energia eólica e solar, produção de sal e cultura potiguar.\n\n*${aggr.short}*${pad}`;
            }

            return `**[${modelId}]** (${aggr.short})\n\n${escapeHtml(promptText.slice(0, 140))}`;
        }

        function stopActiveGeneration() {
            generationToken++;
            abortControllers.forEach(c => {
                try { c.abort(); } catch (_) {}
            });
            abortControllers = [];
            isBusy = false;
            setBusyUI(false);
        }

        /* =====================================================================
           RENDERING CONVERSATION, RANKED ARENA & DESKTOP INSPECTOR
           ===================================================================== */
        function renderConversation() {
            const cfg = currentProfileConfig();
            const chat = getActiveChat();
            const welcomeView = document.getElementById('welcome-view');
            const feed = document.getElementById('messages-feed');

            if (!chat || !chat.messages || chat.messages.length === 0) {
                welcomeView.classList.remove('hidden');
                feed.classList.add('hidden');
                feed.innerHTML = '';
                renderDesktopInspector(null);
                return;
            }

            welcomeView.classList.add('hidden');
            feed.classList.remove('hidden');
            feed.innerHTML = '';

            let latestArena = null;

            chat.messages.forEach((msg, idx) => {
                if (msg.role === 'user') {
                    const attsHtml = (msg.attachments && msg.attachments.length > 0)
                        ? `<div class="flex flex-wrap gap-2 mb-2">` + msg.attachments.map(a =>
                            a.kind === 'image' && a.dataUrl
                                ? `<img src="${a.dataUrl}" alt="${escapeHtml(a.name)}" class="max-h-44 rounded-xl border border-dz-border">`
                                : `<span class="px-2.5 py-1 rounded-lg bg-dz-bg border border-dz-border text-xs text-sky-300">${escapeHtml(a.name)}</span>`
                        ).join('') + `</div>`
                        : '';

                    const textToShow = msg.displayText !== undefined ? msg.displayText : msg.content;
                    const row = document.createElement('div');

        function setupMarkdown() {
            const renderer = new marked.Renderer();
            renderer.code = function(codeObj, langArg) {
                const rawCode = typeof codeObj === 'object' ? codeObj.text : codeObj;
                const langName = (typeof codeObj === 'object' ? codeObj.lang : langArg) || 'txt';
                let highlighted = rawCode;
                try {
                    highlighted = langName && hljs.getLanguage(langName)
                        ? hljs.highlight(rawCode, { language: langName }).value
                        : hljs.highlightAuto(rawCode).value;
                } catch (_) {}

                const extMap = {
                    python: 'py', py: 'py',
                    javascript: 'js', js: 'js',
                    typescript: 'ts', ts: 'ts',
                    html: 'html', css: 'css',
                    json: 'json', sh: 'sh', bash: 'sh',
                    sql: 'sql', md: 'md', markdown: 'md'
                };
                const ext = extMap[String(langName).toLowerCase()] || 'txt';
                const encoded = encodeURIComponent(rawCode);

                return `<pre><div class="code-bar"><span class="uppercase font-bold text-dz-muted">${escapeHtml(langName)}</span><div class="flex items-center gap-1.5"><button type="button" onclick="downloadEncoded('${encoded}', 'dzxzxzx_code.${ext}')" class="h-7 px-2.5 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i><span>.${ext}</span></button><button type="button" onclick="copyEncoded('${encoded}')" class="h-7 px-2.5 rounded-lg bg-dz-card text-white border border-dz-border flex items-center gap-1"><i data-lucide="copy" class="w-3 h-3"></i><span>${escapeHtml(t('copy'))}</span></button></div></div><code class="hljs language-${escapeHtml(langName)}">${highlighted}</code></pre>`;
            };
            marked.setOptions({ renderer, breaks: true, gfm: true });
        }

        function saveBlobFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function downloadEncoded(encoded, filename) {
            saveBlobFile(decodeURIComponent(encoded), filename);
            showToast(`${t('downloading')} ${filename}`);
        }

        function downloadMessageFile(msgIdx, ext) {
            const msg = getActiveChat()?.messages?.[msgIdx];
            if (!msg) return;
            const filename = `dzxzxzx_${msgIdx + 1}.${ext}`;
            saveBlobFile(msg.content || '', filename);
            showToast(`${t('downloading')} ${filename}`);
        }

        function downloadArenaModel(msgIdx, modelId) {
            const arena = getActiveChat()?.messages?.[msgIdx];
            const entry = arena?.entries?.find(e => e.model === modelId);
            if (!entry) return;
            const safeId = modelId.replace(/[^a-zA-Z0-9_-]/g, '_');
            const filename = `${entry.rank || 'x'}_${safeId}.md`;
            saveBlobFile(`# ${entry.rank || ''}º — ${entry.model}\n\n${entry.content}`, filename);
            showToast(`${t('downloading')} ${filename}`);
        }

        function downloadArenaLeaderboard(msgIdx) {
            const arena = getActiveChat()?.messages?.[msgIdx];
            if (!arena) return;
            const ordered = [...(arena.entries || [])].sort((a, b) => (a.rank || 999) - (b.rank || 999));
            const md = `# ${t('rankingTitlePrefix')}\n\n**Prompt:** ${arena.prompt}\n\n**${arena.winnerSummary || ''}**\n\n` +
                ordered.map((e, i) => `## ${e.rank || (i + 1)}º — ${e.model} (${Number(e.score || 0).toFixed(1)})\n\n${e.content}`).join('\n\n---\n\n');
            saveBlobFile(md, 'ranking_dzxzxzx.md');
            showToast(`${t('downloading')} ranking_dzxzxzx.md`);
        }

        function downloadActiveConversation() {
            const chat = getActiveChat();
            if (!chat || !chat.messages.length) return;
            const md = `# ${chat.title}\n\n` + chat.messages.map(m => {
                if (m.role === 'user') return `### User\n${m.content}`;
                if (m.role === 'assistant') return `### ${m.model || 'dzxzxzx'}\n${m.content}`;
                return `### Arena\n` + (m.entries || []).map(e => `**${e.rank || ''}º ${e.model}:**\n${e.content}`).join('\n\n');
            }).join('\n\n---\n\n');
            saveBlobFile(md, 'conversa_dzxzxzx.md');
            showToast(`${t('downloading')} conversa_dzxzxzx.md`);
        }

        function exportBackupJson() {
            const sanitizedProfiles = {};
            Object.keys(store.profileConfigs || {}).forEach(pid => {
                sanitizedProfiles[pid] = { ...store.profileConfigs[pid], apiKey: '' };
            });
            const payload = JSON.stringify({
                creator: '@dvzxzxnzx',
                profiles: store.profiles,
                activeProfileId: store.activeProfileId,
                profileConfigs: sanitizedProfiles
            }, null, 2);
            saveBlobFile(payload, 'dzxzxzx_backup.json');
            showToast(`${t('downloading')} dzxzxzx_backup.json`);
        }

        function copyText(text) {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            try {
                document.execCommand('copy');
                showToast(t('copied'));
            } catch (_) {}
            document.body.removeChild(area);
        }

        function copyEncoded(encoded) {
            copyText(decodeURIComponent(encoded));
        }

        function copyByIndex(idx) {
            const msg = getActiveChat()?.messages?.[idx];
            if (msg) copyText(msg.content || '');
        }

        function copyArenaModel(msgIdx, modelId) {
            const entry = getActiveChat()?.messages?.[msgIdx]?.entries?.find(e => e.model === modelId);
            if (entry) copyText(entry.content || '');
        }

        /* =====================================================================
           CHAT HISTORY, TOP TAB BAR, MODALS & GUIDE
           ===================================================================== */
        function createNewChat(closeNav = true) {
            const cfg = currentProfileConfig();
            const newChat = {
                id: 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                title: t('newChat'),
                messages: []
            };
            cfg.chats.unshift(newChat);
            cfg.activeChatId = newChat.id;
            persistStore();
            renderChatHistory();
            renderConversation();
            syncAllControls();
            if (closeNav) closeDrawer();
        }

        function getActiveChat() {
            const cfg = currentProfileConfig();
            return cfg.chats.find(c => c.id === cfg.activeChatId);
        }

        function renderChatHistory() {
            const cfg = currentProfileConfig();
            const chats = cfg.chats || [];
            const container = document.getElementById('chat-history-list');
            container.innerHTML = chats.map(c => {
                const isCurrent = c.id === cfg.activeChatId;
                return `
                    <div onclick="selectChat('${escapeJs(c.id)}')" class="h-10 px-3 rounded-xl flex items-center justify-between gap-2 cursor-pointer ${isCurrent ? 'bg-dz-card text-white border border-dz-border' : 'text-dz-muted hover:bg-dz-card/60'}">
                        <span class="text-xs truncate font-medium">${escapeHtml(c.title)}</span>
                        <button type="button" onclick="deleteChat(event, '${escapeJs(c.id)}')" aria-label="Delete" class="p-1.5 rounded-lg text-dz-muted hover:text-rose-400 shrink-0">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            }).join('');

            const convTabs = document.getElementById('top-conv-tabs');
            convTabs.innerHTML = chats.slice(0, 6).map(c => {
                const active = c.id === cfg.activeChatId;
                return `
                    <button type="button" onclick="selectChat('${escapeJs(c.id)}')" class="h-8 px-2.5 rounded-lg text-xs font-medium max-w-[130px] truncate shrink-0 border ${active ? 'bg-dz-elevated text-white border-dz-accent/60' : 'bg-dz-card/50 text-dz-muted hover:text-white border-dz-border'}">
                        ${escapeHtml(c.title)}
                    </button>
                `;
            }).join('');

            lucide.createIcons();
        }

        function selectChat(chatId) {
            const cfg = currentProfileConfig();
            if (isBusy) stopActiveGeneration();
            cfg.activeChatId = chatId;
            persistStore();
            renderChatHistory();
            renderConversation();
            closeDrawer();
        }

        function deleteChat(ev, chatId) {
            ev.stopPropagation();
            const cfg = currentProfileConfig();
            cfg.chats = cfg.chats.filter(c => c.id !== chatId);
            if (cfg.chats.length === 0) {
                createNewChat(false);
                return;
            }
            if (cfg.activeChatId === chatId) cfg.activeChatId = cfg.chats[0].id;
            persistStore();
            renderChatHistory();
            renderConversation();
        }

            document.querySelectorAll('.aggr-pct').forEach(p => { p.textContent = `${cfg.aggressiveness}%`; });
            document.querySelectorAll('.aggr-label').forEach(l => { l.textContent = aggr.desc; });
            document.querySelectorAll('.aggr-short').forEach(s => { s.textContent = aggr.short; });

            const available = (cfg.discoveredModels || []).filter(isChatCompatibleModelId);
            const liveReady = !cfg.demoMode && cfg.isApiValid && Boolean(cfg.apiKey);
            document.querySelectorAll('.api-status-dot').forEach(dot => {
                dot.className = liveReady
                    ? 'api-status-dot w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0'
                    : 'api-status-dot w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0';
            });
            document.querySelectorAll('.api-status-text').forEach(tEl => {
                tEl.textContent = liveReady ? t('bannerLiveTitle') : (cfg.demoMode ? t('bannerDemoTitle') : t('bannerPendingTitle'));
            });
            document.querySelectorAll('.api-sub-text').forEach(sEl => {
                sEl.textContent = `${available.length} • ${eligibleSelected.length}`;
            });

            const bTitle = document.getElementById('banner-title');
            const bDesc = document.getElementById('banner-desc');
            if (liveReady) {
                bTitle.className = 'text-xs font-bold text-emerald-300 truncate';
                bTitle.textContent = `${t('bannerLiveTitle')} (${available.length})`;
                bDesc.textContent = `${t('bannerLiveDesc')} ${cfg.endpoint}`;
            } else if (cfg.demoMode) {
                bTitle.className = 'text-xs font-bold text-amber-300 truncate';
                bTitle.textContent = t('bannerDemoTitle');
                bDesc.textContent = t('bannerDemoDesc');
            } else {
                bTitle.className = 'text-xs font-bold text-rose-300 truncate';
                bTitle.textContent = t('bannerPendingTitle');
                bDesc.textContent = t('bannerPendingDesc');
            }
        }

        function switchGuideTab(tab) {
            const cfg = currentProfileConfig();
            currentGuideTab = tab;
            ['mobile', 'pc', 'models'].forEach(tKey => {
                const btn = document.getElementById(`guide-tab-${tKey}`);
                if (!btn) return;
                btn.className = tKey === tab
                    ? 'h-9 px-3.5 rounded-xl bg-dz-accent text-white text-xs font-semibold'
                    : 'h-9 px-3.5 rounded-xl bg-dz-card text-dz-muted hover:text-white text-xs font-semibold';
            });

            const body = document.getElementById('guide-content-body');
            if (cfg.language === 'en-US') {
                body.innerHTML = tab === 'mobile'
                    ? '<p class="font-bold text-white">Mobile Setup</p><p>Choose Mobile mode, open API settings, tap Key next to your provider to open its key portal, paste your API key, and validate chat models. Use the camera and attachment icons to send photos or files.</p>'
                    : tab === 'pc'
                        ? '<p class="font-bold text-white">PC & GitHub Pages</p><p>Use clickable buttons in the top bar and sidebar to toggle the sidebar, ranking panel, profiles, and models. Save this single file as <code>index.html</code> and publish on GitHub Pages.</p>'
                        : '<p class="font-bold text-white">Models & Word of God</p><p>Audio/TTS/STT models (such as Orpheus/Whisper) are filtered out automatically, and models with errors or terms requirements are skipped cleanly for the session. Word of God enforces zero profanity.</p>';
            } else if (cfg.language === 'es-ES') {
                body.innerHTML = tab === 'mobile'
                    ? '<p class="font-bold text-white">Configuración en Móvil</p><p>Elige el modo Móvil, abre la configuración de API, toca Clave en tu proveedor para abrir su portal, pega tu clave y valida los modelos de chat. Usa cámara y adjuntos para enviar fotos o archivos.</p>'
                    : tab === 'pc'
                        ? '<p class="font-bold text-white">PC y GitHub Pages</p><p>Usa los botones clicables de la barra superior y lateral para alternar barra, ranking, perfiles y modelos. Guarda este archivo único como <code>index.html</code> y publícalo en GitHub Pages.</p>'
                        : '<p class="font-bold text-white">Modelos y Palabra de Dios</p><p>Los modelos de audio/TTS/STT (como Orpheus/Whisper) se filtran automáticamente y los modelos con error o términos pendientes se omiten en la sesión. Palabra de Dios garantiza cero groserías.</p>';
            } else {
                body.innerHTML = tab === 'mobile'
                    ? '<p class="font-bold text-white">Configuração no Mobile</p><p>Escolha o modo Mobile, abra Configurar API, toque em Chave ao lado do provedor para abrir o site oficial, cole sua chave e valide os modelos de chat. Use câmera e clipe para enviar fotos ou arquivos.</p>'
                    : tab === 'pc'
                        ? '<p class="font-bold text-white">PC e GitHub Pages</p><p>Use os botões clicáveis no topo e na barra lateral para abrir/fechar a barra, o painel de ranking, perfis e modelos. Salve este arquivo único como <code>index.html</code> e publique no GitHub Pages.</p>'
                        : '<p class="font-bold text-white">Modelos & Palavra de Deus</p><p>Modelos de áudio/TTS/STT (como Orpheus/Whisper) são filtrados automaticamente e modelos com erro ou exigência de termos são ignorados na sessão. Palavra de Deus garante zero xingamentos.</p>';
            }
        }

        function openModal(modalId) {
            if (modalId === 'modal-api') renderApiModalLists();
            if (modalId === 'modal-models') renderModelChecklistModal();
            if (modalId === 'modal-profiles') {
                resetProfileForm();
                renderProfilesModal();
            }
            const el = document.getElementById(modalId);
            el.classList.remove('hidden');
            el.classList.add('flex');
            lucide.createIcons();
        }

        function closeModal(modalId) {
            const el = document.getElementById(modalId);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        function openDrawer() {
            document.getElementById('dz-sidebar').classList.add('drawer-open');
            document.getElementById('drawer-backdrop').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeDrawer() {
            document.getElementById('dz-sidebar').classList.remove('drawer-open');
            document.getElementById('drawer-backdrop').classList.add('hidden');
        }

        function toggleKeyVisibility() {
            const inp = document.getElementById('cfg-apikey');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        function setBusyUI(busy) {
            document.getElementById('btn-send-message').classList.toggle('hidden', busy);
            const stopBtn = document.getElementById('btn-stop-generation');
            stopBtn.classList.toggle('hidden', !busy);
            stopBtn.classList.toggle('flex', busy);
        }

        function resizeComposer(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 140) + 'px';
        }

        function scrollFeedToBottom() {
            const area = document.getElementById('dz-scroll-area');
            area.scrollTop = area.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function showToast(msg) {
            const toastEl = document.getElementById('dz-toast');
            document.getElementById('dz-toast-msg').textContent = msg;
            toastEl.classList.remove('opacity-0', 'translate-y-2');
            clearTimeout(window._dzToastTimeout);
            window._dzToastTimeout = setTimeout(() => {
                toastEl.classList.add('opacity-0', 'translate-y-2');
            }, 2400);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeJs(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
